oak_techniques: [OAK-T9.014]
spec_id: oak-detection-T9.014
version: 0.1.0
maturity: emerging
maintainer: "@iZonex"
license: Apache-2.0

scope: |
  Detect vulnerabilities in the reference-client implementation (C++, Rust,
  Go codebase) whose execution determines blockchain consensus — integer
  overflow/underflow, input-validation bypass, and unchecked arithmetic in
  consensus-critical paths (transaction validation, block validation, supply
  accounting, fee calculation). The structural signal is: consensus-code
  arithmetic without overflow checks → transaction/block bypasses validation
  → exploit block accepted by network. Covers the canonical Bitcoin 2010
  value overflow bug (CVE-2010-5139) and the general class of protocol-client
  arithmetic/validation bugs in any reference-client implementation.

  Scope is not limited to arithmetic. Any consensus-critical validation
  short-cut belongs here — caching, memoisation, deduplication, early-return.
  The 2026-09 Liquid Network peg-out (~$320M) was a range-proof verification
  CACHE whose key omitted the asset commitment and output script, so a proof
  verified once was reused in a context where it did not hold. The invariant
  is uniform: a cache key must cover everything the cached verdict depends on.

data_sources: [onchain_block, onchain_transaction, node_client_version,
               security_disclosure_feed, contract_bytecode,
               client_block_validity, peg_reserve_balance, asset_supply_total]

detection_logic:
  description: |
    Two detection paths. PATH A (pre-exploit — consensus-code safe-arithmetic
    audit): audit consensus-critical arithmetic paths in the reference-client
    codebase for unchecked integer overflow/underflow. Produce a safe-arithmetic
    coverage map and flag paths where validation depends on bare integer
    arithmetic. PATH B (post-exploit — client-version adoption monitoring):
    after an emergency client release, monitor the network's client-version
    distribution to verify that a supermajority of validators/miners have
    adopted the patched client. Nodes still running the vulnerable client
    remain exploitable. PATH C (live — cross-implementation validity
    divergence): compare block-acceptance verdicts across independent node
    implementations or explorers; a block one accepts and another rejects is
    a consensus-bug signal available in real time and requires no knowledge
    of the defect. PATH D (live — supply/reserve parity): for any chain or
    sidechain whose asset is backed by a reserve, compare circulating supply
    against reserve held. PATH D is mechanism-independent — it fires whether
    the cause is arithmetic, a cache, a replay, or something unnamed — and is
    the only path that survives confidential-transaction designs, where an
    inflation bug produces no observable artefact in the block itself.
  pseudocode: |
    # PATH A — consensus-code safe-arithmetic audit (pre-exploit)
    # Operates on reference-client source code, not on-chain data
    consensus_paths ← identify_consensus_critical_arithmetic_paths(client_source)

    for each path in consensus_paths:
      arithmetic_ops ← extract_integer_arithmetic_ops(path)
      for each op in arithmetic_ops:
        if not has_overflow_check(op) and not is_safe_math_wrapper(op):
          emit(PATH_A, client=client_source.name, version=client_source.version,
               file=path.file, function=path.function, line=op.line,
               operation=op.kind, operand_types=op.types,
               severity=critical,
               detail="unchecked integer arithmetic in consensus-critical path")

    # PATH B — client-version adoption monitoring (post-exploit)
    on emergency_client_release R for vulnerability V:
      patched_version ← R.patched_client_version
      vulnerable_versions ← R.vulnerable_version_set

      for each validator v in network.current_validators:
        if v.client_version in vulnerable_versions:
          emit(PATH_B, validator=v.address, client=v.client_implementation,
               version=v.client_version, vulnerability=V,
               exploit_block=R.exploit_block,
               severity=critical,
               detail="validator running vulnerable client version post-patch")

      adoption_rate ← count(validators with patched_version) / count(all validators)
      if adoption_rate < supermajority_threshold:
        emit(PATH_B, severity=critical,
             detail="patched client adoption below supermajority threshold")

    # PATH C — cross-implementation validity divergence (live)
    # Anchor: Liquid block 4,050,336 — Blockstream explorer accepted it,
    # mempool.space rejected it and stalled, ~13 min before the peg-out.
    for each block B at height H:
      verdicts ← {}
      for each independent source S in validity_sources:      # nodes and/or explorers
        verdicts[S] ← S.accepts(B)                            # accept | reject | not-yet-seen

      if count(distinct decided verdicts in verdicts) > 1:
        emit(PATH_C, chain=B.chain, height=H, block=B.hash,
             accepting=sources where verdicts = accept,
             rejecting=sources where verdicts = reject,
             severity=critical,
             detail="independent implementations disagree on block validity")

      # A stalled tip is the same signal in its slower form
      for each source S in validity_sources:
        if (network_tip_height - S.tip_height) > tip_lag_blocks:
          emit(PATH_C, source=S, lag=network_tip_height - S.tip_height,
               severity=high,
               detail="implementation tip stalled relative to network — possible rejected block")

    # PATH D — supply / reserve parity (live, mechanism-independent)
    # Enforce as a PRE-SIGNING condition, not as an alert, wherever a signer
    # set can be asked to release reserve against a burn it did not verify.
    on each interval:
      circulating ← total_supply(pegged_asset)                # destination chain
      reserve     ← balance(reserve_address)                  # backing chain
      if circulating > reserve * (1 + parity_tolerance):
        emit(PATH_D, asset=pegged_asset,
             circulating=circulating, reserve=reserve,
             delta=circulating - reserve,
             severity=critical,
             detail="circulating supply exceeds reserve — unbacked issuance")

    on peg_out_request R:                                     # signer-side gate
      if not parity_holds_at(R.block):
        block_signing(R)
        emit(PATH_D, request=R, severity=critical,
             detail="peg-out refused: supply/reserve parity not established at request block")

    # Supply-delta bound, for chains that mint on message receipt
    if supply_delta_this_epoch > max_supply_delta_per_epoch:
      emit(PATH_D, delta=supply_delta_this_epoch, severity=critical,
           detail="epoch supply growth exceeds hard bound")

parameters:
  supermajority_threshold:             { type: float,    default: 0.90 }   # 90% of validators must upgrade
  safe_arithmetic_wrappers:            { type: list,     default: ["checked_add", "checked_sub", "checked_mul", "saturating_add", "SafeMath", "overflow_checks"] }  # known safe-math wrappers
  consensus_critical_functions:        { type: list,     default: ["CheckTransaction", "CheckBlock", "ConnectBlock", "AcceptToMemoryPool", "VerifySignature", "CalculateSupply"] }
  validity_sources:                    { type: list,     default: [] }      # >= 2 independent nodes/explorers; PATH C is inert below 2
  tip_lag_blocks:                      { type: int,      default: 3 }       # stalled-tip threshold before alerting divergence
  parity_tolerance:                    { type: float,    default: 0.0 }     # circulating-vs-reserve slack; 0 for hard-pegged assets
  max_supply_delta_per_epoch:          { type: float,    default: 0.001 }   # 0.1% of supply per epoch — mechanism-independent mint bound

output_alert: [oak_technique, detection_path, severity, chain,
               client_implementation, client_version, vulnerability_id,
               file, function, validator_address, block_height, block_hash,
               accepting_sources, rejecting_sources,
               circulating_supply, reserve_balance, evidence]

test_fixtures:
  positive:
    - 2010-08-bitcoin-value-overflow-bug                                    # Canonical anchor — C++ integer overflow in CheckTransaction()
    - 2026-09-liquid-network-rangeproof-cache-unbacked-lbtc-pegout          # PATH C fired publicly ~13 min early (explorer divergence, block 4,050,336); PATH D would have refused the peg-out
    - 2026-06-zcash-orchard-counterfeiting-circuit-underconstraint-disclosure # PATH A analogue at the circuit layer; unexploited disclosure
  negative:
    - "Transaction with large output values that are correctly rejected by overflow-checked validation — safe-math wrappers present, should not alert"
    - "Reference client where all consensus-critical arithmetic paths use checked/saturating arithmetic — no bare integer ops, should not alert"
    - "Client-version upgrade that reaches 95% supermajority adoption within 24 hours of emergency release — compliant, should not alert"

false_positive_modes:
  - Arithmetic in non-consensus-critical code paths (RPC handlers, UI/CLI formatting, wallet code) flagged as consensus-critical — require function-level consensus-criticality annotation before escalation
  - Client-version reporting lag where validators have upgraded but the monitoring infrastructure still reports the old version — check block-production timestamps against client-version-announcement timestamps
  - Multi-client networks where a minority client has a divergent but benign arithmetic behaviour (e.g., different rounding direction that doesn't affect consensus) — require consensus-impact confirmation before escalation
  - Emergency client release for a non-consensus-bug vulnerability (DoS, memory corruption, RPC crash) — verify the vulnerability class is consensus-level (economic rules bypass), not operational-level
  - "PATH C: an explorer or node that is simply behind, offline, resyncing, or reindexing looks identical to one rejecting a block — require the lagging source to have been at the network tip immediately before the divergence, and prefer an explicit reject verdict over an inferred one from a stalled tip"
  - "PATH C: benign short-lived forks and reorg races produce transient disagreement at the tip — evaluate divergence only at a depth beyond the chain's normal reorg window"
  - "PATH D: legitimate peg-in that has confirmed on the backing chain but not yet credited on the destination chain (or the reverse) makes circulating and reserve disagree transiently — settle both sides to a common finality depth before comparing, and widen `parity_tolerance` only for assets that are not hard-pegged"
  - "PATH D: reserve balances split across multiple or rotating addresses read as a shortfall when the monitor knows only one address — enumerate the full reserve address set, and treat an unexplained reserve address change as its own alert rather than as parity noise"

mitigations: []

